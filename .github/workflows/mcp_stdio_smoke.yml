# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: mcp_stdio_smoke

# Post-build gate: build the stdio example and probe every Inspector-facing
# route of src/server (initialize, lists, strict schema gate, call, negative).
on:
  push:
    branches: [main]
    paths:
      - "src/server/**"
      - "examples/**"
      - "scripts/mcp-stdio-smoke.sh"
      - "cmake/**"
      - "CMakeLists.txt"
      - "CMakePresets.json"
      - ".github/workflows/mcp_stdio_smoke.yml"
  pull_request:
    branches: [main]
    paths:
      - "src/server/**"
      - "examples/**"
      - "scripts/mcp-stdio-smoke.sh"
      - "cmake/**"
      - "CMakeLists.txt"
      - "CMakePresets.json"
      - ".github/workflows/mcp_stdio_smoke.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CPM_SOURCE_CACHE: ${{ github.workspace }}/.cpm_cache
  INSPECTOR_VERSION: "2.7.0"

jobs:
  stdio_smoke:
    name: linux_gcc_x86_64_mcp_inspector_stdio
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up build
        uses: ./.github/actions/setup-cmake
        with:
          cache-key: mcp-stdio-smoke
      - name: Set up Node 22 (Inspector floor is >=22.19.0)
        uses: actions/setup-node@v6
        with:
          node-version: "22.x"
      - name: Configure (linux GCC preset)
        run: cmake --preset linux_gcc_x86_64
      - name: Build example_parse_schema only
        run: cmake --build build/linux_gcc_x86_64 --config Release --target example_parse_schema
      - name: Locate stdio binary
        shell: bash
        run: |
          bin="$(find build -type f -name 'example_parse_schema*' -print | sort | head -n 1)"
          test -n "${bin}" || { echo "::error::example_parse_schema not found under build/"; exit 1; }
          echo "STDIO_BIN=${bin}" >> "${GITHUB_ENV}"
          echo "Probing ${bin}"
          ls -l "${bin}"
      - name: MCP Inspector stdio smoke (connect -> list -> call -> assert)
        shell: bash
        run: bash scripts/mcp-stdio-smoke.sh
      - name: Upload Inspector transcripts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mcp-inspector-stdio-${{ github.run_id }}
          path: mcp-inspector-results/
          retention-days: 30
          if-no-files-found: error
          compression-level: 6
