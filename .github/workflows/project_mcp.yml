# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: project_mcp

on:
  pull_request:
    paths: &mcp_paths
      - "opencode.json"
      - "scripts/libmcp_project_mcp.py"
      - "scripts/project_mcp.py"
      - "scripts/test_project_mcp.py"
      - ".github/workflows/project_mcp.yml"
  push:
    branches: [main]
    paths: *mcp_paths
  workflow_dispatch:

concurrency:
  group: project_mcp-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  smoke:
    name: python_${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Static smoke test
        run: python scripts/test_project_mcp.py
      - name: Bootstrap isolated environment
        run: python scripts/libmcp_project_mcp.py --install-only
