[project]
name = "libmcp-project-mcp"
version = "0.1.0"
description = "Repository-local MCP server for libmcp agents"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.26,<2",
]

[project.scripts]
libmcp-project-mcp = "project_mcp:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["project_mcp.py"]
